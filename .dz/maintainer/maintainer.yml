# yaml-language-server: $schema=https://developerz.ai/schemas/maintainer.v1.json
# developerz.ai maintainer policy: developerz-ai/open-remote-ssh-tmux
#
# AI-maintained: the agent triages, answers, reviews and closes what has stalled, and merges on
# green for its own pull requests (dependency bumps wait for a member: see `pr.auto_merge_scope`). Releases stay with publish.yml: nothing here publishes.
version: 1

tone:
  voice: friendly
  language: en

triage:
  ask_for_repro: true
  required_fields: [steps, expected, actual, version]
  qualify_into: [bug, feature, dupe, question, docs]
  close_unanswered_repro_after_days: 14
  stale_after_days: 30
  stale_action: comment_then_close
  non_goals:
    - "A rewrite of the SSH transport: it stays"
    - "Tmux commands or anything tmux-shaped surfaced to the user: same UX as open-remote-ssh"
    - "Persisting anything beyond terminals: reconnect of the rest already works and is left alone"
    - "Tmux logic on the SSH classes"
    - "Outside human contributors' changes to CI or publish automation (.github/): members maintain that pipeline"

handoff:
  mode: fleet
  ask_reporter_first: false

pr:
  wait_for_other_bots: [coderabbit]
  # Named so the agent knows which red check is the author's to fix. Re-check against the
  # repo's protection and `.github/workflows/` when either changes; this list is not the ruleset.
  required_checks:
    - "check"
  auto_merge: true
  # An outside contributor's pull request, a member's, and a dependency bot's wait for a member.
  # Dependency bumps are deliberately out: the wanted policy is "auto-merge patch-level
  # devDependencies only; runtime deps (ssh2, socks, simple-socks, ...) always need review",
  # and this schema has no update-type or dependency-type filter to express it. Narrowing to
  # `own` is the strict side of that until it can (owner decision, 2026-11 hardening sweep).
  auto_merge_scope: own
  require_review: true
  close_awaiting_author_after_days: 21

review:
  force: true # without this the native review defers to CodeRabbit where CodeRabbit is active

release:
  # `none`: there is no release manager. Empty channels: the agent publishes nothing itself.
  # A maintainer cuts a release by pushing a `v*` tag (publish.yml). Cadence (owner, 2026-11-26):
  # at most one release a week, judged on a Monday; a merge, a fix or a fix count never cuts one.
  # The only off-cycle release is a fix for a published first-tier advisory (GHSA, NVD, CISA KEV or
  # the vendor's own) rated high or critical (CVSS >= 7.0, or KEV-listed) in what the .vsix ships;
  # not a dev-only, test or docs-tooling dependency. Own hardening with no advisory waits for Monday.
  manager: none
  channels: []

escalate:
  # Empty: nothing beyond the platform's hardcoded asks (security, license, CLA).
  ask_before_acting: []

schedules:
  # Weekly (owner, 2026-11-06: routine maintenance weekly, CVE daily). Security has its own lanes.
  - name: health
    days: [mon]
    hours_utc: [7]
    brief_file: .dz/schedules/health.md
  - name: improve
    days: [mon]
    weeks_of_month: [1] # the first Monday of the month
    hours_utc: [8]
    brief_file: .dz/schedules/improve.md

# Added by the developerz.ai maintainer agent: blocks from the current template this file did not have. Each states the value already in effect; edit it like any other key.

# branches: on at 60 because this file exists. A branch with no new commit
# this long is tagged archive/<branch>/<date> at its last commit, then deleted.
# false keeps every branch. See /docs/maintainer-yml.
branches:
  close_inactive_after_days: 14 # owner, 2026-11-26: two weeks idle, archive-tagged then deleted

# scout: the platform's daily survey of this repo files only what is already BROKEN
# (red CI, failing tests, a security advisory, a broken build or link), never an
# improvement idea. `full` lets it file ideas too; `off` stops the survey.
scout:
  survey: broken_only

# devops: off (owner, 2026-11-26): one PR per advisory was noise. Dependabot security updates
# (.github/dependabot.yml `*-security` groups, one PR per ecosystem) are the advisory lane.
devops:
  watch: off
