      (webpack production, 643 KiB extension.js), `npm run package`
      (.vsix builds, 215 KB), `bash -n src/scripts/server-setup.sh` (OK).
    real_tmux_empirical_pass: >
      Beyond the gates, drove the COMPILED src/tmux/tmuxSession.ts builders
      against a real, local tmux 3.4 server (isolated `-L` socket, no VS
      Code involved — this environment has no VS Code desktop
      binary/display, see docs/idea/ai-first.md) to get genuine
      tmux-protocol evidence for the matrix rows a live attach would
      exercise. This is real signal a mocked-exec unit suite structurally
      cannot produce.
    bug_found_and_fixed: >
      Found a real, previously-shipped bug this way: the two `set-option`
      calls in buildAttachOrCreateArgv (`status off`, `history-limit N`)
      used a bare `-t =<name>` exact-match target, which silently fails
      against real tmux (`set-option`'s `-t` is target-WINDOW syntax; bare
      `=<name>` is not resolved as "exact session, default window" the way
      it is for has-session/kill-session/set-window-option). Effect: the
      tmux status bar stayed VISIBLE on every real terminal (a hard
      Invisible-UX violation) and historyLimit silently never applied —
      invisible to every prior unit test because they fake exec and never
      touch real tmux. Fixed with `=<name>:` (trailing colon). TDD
      red->green (test/tmux/tmuxSession.test.ts updated first, confirmed
      RED, then src/tmux/tmuxSession.ts fixed, confirmed GREEN, full suite
      377/377). Re-verified post-fix against real tmux:
      status off / history-limit 1000 / remain-on-exit off all confirmed
      applied on a real session via one real interactive `-A` pty attach
      running the exact unmodified production argv chain end-to-end.
    other_real_tmux_checks_passed:
      - "attach-or-create against a real server: session created, correctly named, survives a second -A call (no duplicate)"
      - "real #{pane_dead} corpse detection: shouldReap correctly flags a real dead-pane session"
      - "real #{session_attached} flips 0->1 on an actual client attach (no-mirror guard's underlying signal)"
      - "exact-match -t =<name> on has-session/kill-session verified against a deliberately colliding neighbour session name (no misfire)"
