notes: >-
  Owner decisions applied: handOff default auto (idle = no keyboard input for 120 s; a watched-only window
  counts as idle, documented); systemd lifetime = detect logind KillUserProcesses + one-time warning, no wrapper.
  Slice 03's detach-on-deactivate never reached the remote (ext host dies ~5 ms after terminate) and was
  replaced in #68 by a remote close watch that marks sessions @orst_closed. Rig per-version: whole chain
  works on tmux 2.6, 3.0a, 3.4, 3.5a, 3.8 (floor stays 2.6); client_activity moves on keystrokes only;
  set -gu @user-option crashes tmux 2.6 (never done). Known limitation: Esc held ~0.5 s on tmux 3.8 (tmux
  #5777, fixed upstream 2b12402). Deferred: Windows remote (row 13), Claude Code TUI (18), logind host (36),
  ProxyJump/password/port-forward regression drive, field replay, local zizmor pin, simple-socks stays a git
  dep (fork differs from registry), server tarball checksum (TLS only).
