name: Publish Extension

on:
  workflow_dispatch: {}
  push:
    tags:
      - v*

env:
  PUBLISH_OPENVSX: ${{ vars.PUBLISH_OPENVSX }}
  PUBLISH_VSCODE: ${{ vars.PUBLISH_VSCODE }}

permissions:
  contents: write   # Release

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Release exactly the tag that triggered this run, and only when it is the version
      # package.json declares: the newest tag in the repository is not necessarily this one
      # (a preview prerelease, an upstream tag), and a tag pushed without bumping
      # package.json would otherwise publish a vsix that reports another version.
      - name: Check tag matches package.json
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::Publish runs on a version tag, not on ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}"
            exit 1
          fi

          EXPECTED="v$(jq -r .version package.json)"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${EXPECTED}"
            exit 1
          fi

          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "Using version: ${GITHUB_REF_NAME}"

      - name: Check Existing Release
        run: |
          # Try to get the release information
          RELEASE_INFO=$(gh release view ${VERSION} --json assets,url 2>/dev/null || echo "")

          if [ ! -z "$RELEASE_INFO" ]; then
            echo "Release exists"
            echo "RELEASE_EXISTS=yes" >> $GITHUB_ENV

            # Get the VSIX asset URL from the release
            VSIX_URL=$(echo $RELEASE_INFO | jq -r '.assets[] | select(.name | endswith(".vsix")) | .url')

            if [ ! -z "$VSIX_URL" ]; then
              echo "Found existing VSIX file"
              echo "VSIX_URL=$VSIX_URL" >> $GITHUB_ENV
              echo "VSIX_NAME=$(echo $RELEASE_INFO | jq -r '.assets[] | select(.name | endswith(".vsix")) | .name')" >> $GITHUB_ENV
            fi
          else
            echo "RELEASE_EXISTS=no" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download Existing VSIX
        if: env.RELEASE_EXISTS == 'yes' && env.VSIX_URL != ''
        run: |
          gh api ${VSIX_URL} --header 'Accept: application/octet-stream' > ${VSIX_NAME}
          echo "CHECKSUM=$(sha256sum ${VSIX_NAME} | cut -d ' ' -f 1)" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      # The release-packaging runtime deliberately deviates from .nvmrc (Node 20):
      # the locked @vscode/vsce packaging subtree requires Node >= 22.13.0
      # (@azure/identity and @azure/core-process demand >= 22.0.0; the eslint-family
      # ranges demand ^20.19.0 || ^22.13.0 || >=24). `npm ci` only *warns* about an
      # unmet engine floor, so the guard below turns that warning into a hard
      # failure before anything is packaged. Keep this pin in sync with preview.yml.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm ci

      # After `npm ci`: the guard reads the lockfile with `semver`, which it requires
      # from node_modules.
      - name: Check packaging Node compatibility
        run: node .github/scripts/check-packaging-node.js

      # The same gates a pull request passes, on the tagged commit itself: nothing is
      # published that did not build, test and lint.
      - name: Build
        run: |
          npm run build

      - name: Test
        run: |
          npm test

      - name: Lint code
        run: |
          npm run lint

      - name: Package
        if: env.RELEASE_EXISTS == 'no'
        run: |
          npm run package

          VSIX_NAME=$(ls *.vsix)
          CHECKSUM=$(sha256sum $VSIX_NAME | cut -d ' ' -f 1)

          echo "VSIX_NAME=$VSIX_NAME" >> $GITHUB_ENV
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_ENV
          echo "$CHECKSUM" > "$VSIX_NAME.sha256"

      - name: Get Changelog
        if: env.RELEASE_EXISTS == 'no'
        run: |
          CHANGELOG_ENTRY=$(node .github/scripts/get-changelog.js ${VERSION})

          # Properly handle multiline output in GitHub Actions
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)

          echo "CHANGELOG_ENTRY<<$EOF" >> $GITHUB_ENV
          echo "$CHANGELOG_ENTRY" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Release
        if: env.RELEASE_EXISTS == 'no'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2 # zizmor: ignore[superfluous-actions]
        with:
          files: |
            ${{ env.VSIX_NAME }}
            ${{ env.VSIX_NAME }}.sha256
          name: ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          body: |
            Release ${{ env.VERSION }}

            ## What's Changed
            ${{ env.CHANGELOG_ENTRY }}

            ## Installation
            1. [Download the .vsix file](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ env.VSIX_NAME }})
            2. In your editor, open the Command Palette (<kbd>Meta</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd>)
            3. Type `Install from VSIX` and select the downloaded file

            ## Checksum (SHA-256)
            ```
            ${{ env.CHECKSUM }}
            ```

      - name: Publish to Open VSX Registry
        if: env.PUBLISH_OPENVSX == 'yes'
        uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2.0.0
        with:
          extensionFile: ${{ env.VSIX_NAME }}
          pat: ${{ secrets.OPEN_VSX_PAT }}
          skipDuplicate: true

      # - name: Publish to Visual Studio Code Marketplace
      #   if: env.PUBLISH_VSCODE == 'yes'
      #   uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2.0.0
      #   with:
      #     extensionFile: ${{ env.VSIX_NAME }}
      #     pat: ${{ secrets.TOKEN_VSCODE }}
      #     registryUrl: https://marketplace.visualstudio.com
      #     skipDuplicate: true
