name: Preview

on:
  workflow_dispatch: {}

permissions:
  contents: write   # Release

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get Version
        run: |
          # Get the latest tag
          LATEST_TAG=$(git tag --sort=-v:refname | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No tags found in the repository"
            exit 1
          fi

          echo "VERSION=$LATEST_TAG" >> $GITHUB_ENV
          echo "Using version: $LATEST_TAG"

      # The release-packaging runtime deliberately deviates from .nvmrc (Node 20):
      # the locked @vscode/vsce packaging subtree requires Node >= 22.13.0
      # (@azure/identity and @azure/core-process demand >= 22.0.0; the eslint-family
      # ranges demand ^20.19.0 || ^22.13.0 || >=24). `npm ci` only *warns* about an
      # unmet engine floor, so the guard below turns that warning into a hard
      # failure before anything is packaged. Keep this pin in sync with publish.yml.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm ci

      # After `npm ci`: the guard reads the lockfile with `semver`, which it requires
      # from node_modules.
      - name: Check packaging Node compatibility
        run: node .github/scripts/check-packaging-node.js

      # Next prerelease of the newest tag (v1.2.0 -> 1.2.1-beta.0 -> 1.2.1-beta.1), with the
      # locked `semver` CLI: no registry fetch, and no version tool committing or tagging
      # behind our back. A computed tag that already exists is refused rather than released
      # over: that would re-point an existing (possibly stable) release at this build.
      - name: Update package.json
        run: |
          PREVIEW_VERSION="$(npx --no semver -i prerelease --preid beta "${VERSION#v}")"
          RELEASE_TAG="v${PREVIEW_VERSION}"

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::Tag ${RELEASE_TAG} already exists; refusing to release over it"
            exit 1
          fi

          jq --arg version "${PREVIEW_VERSION}" '.version = $version | .preview = true' package.json > package.json.tmp
          mv package.json.tmp package.json

          jq -r '"version: \(.version)\npreview: \(.preview)"' package.json

          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      # The same gates a pull request passes: nothing is released that did not build,
      # test and lint.
      - name: Build
        run: |
          npm run build

      - name: Test
        run: |
          npm test

      - name: Lint code
        run: |
          npm run lint

      - name: Package
        run: |
          npm run package

          VSIX_NAME=$(ls *.vsix)
          CHECKSUM=$(sha256sum $VSIX_NAME | cut -d ' ' -f 1)

          echo "VSIX_NAME=$VSIX_NAME" >> $GITHUB_ENV
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_ENV
          echo "$CHECKSUM" > "$VSIX_NAME.sha256"

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2 # zizmor: ignore[superfluous-actions]
        with:
          files: |
            ${{ env.VSIX_NAME }}
            ${{ env.VSIX_NAME }}.sha256
          name: ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: true
          body: |
            Release ${{ env.RELEASE_TAG }}

            ## What's Changed

            ## Installation
            1. [Download the .vsix file](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${{ env.VSIX_NAME }})
            2. In your editor, open the Command Palette (<kbd>Meta</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd>)
            3. Type `Install from VSIX` and select the downloaded file

            ## Checksum (SHA-256)
            ```
            ${{ env.CHECKSUM }}
            ```
