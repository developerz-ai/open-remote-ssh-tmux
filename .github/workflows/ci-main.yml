name: "CI - Main: Build & Lint"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm ci

      - name: Build
        run: |
          npm run build

      # The unit suite under the coverage thresholds in vitest.config.ts.
      - name: Test
        run: |
          npm run test:coverage

      # Not the full local gate: the dependency-advisory and workflow audits judge the
      # outside world (new advisories, new rules) and so could red a change that touched
      # nothing; they run on a schedule in audit.yml. fixpack rewrites package.json in
      # place, so a diff after it means the committed manifest was not normalised.
      - name: Lint package manifest
        run: |
          npm run lint:package
          git diff --exit-code -- package.json

      - name: Lint code
        run: |
          npm run lint

      - name: Lint commit
        # `github.event.before` cannot be handed to commitlint as-is. It is all-zeros when
        # the branch is created, and after a force-push it names the branch's PREVIOUS head
        # — a commit that may be unreachable, on a diverged history, or absent from this
        # clone entirely. `<gone>..<head>` then dies with "fatal: Invalid revision range"
        # and reds the build for a commit that already passed. Seen for real: restoring
        # main after GitHub's fork-sync "discard commits" button reset it onto upstream, so
        # `before` was an upstream commit unrelated to our line of history.
        # So: resolve a base this clone can actually diff against, and degrade to the
        # pushed commit alone rather than failing.
        run: |
          BASE=""
          if [[ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"; then
            # Ordinary fast-forward push: `before..head` is exactly the new commits.
            BASE="${BASE_SHA}"
          fi
          if [[ -z "${BASE}" ]] && git rev-parse -q --verify "${HEAD_SHA}^" >/dev/null; then
            # Force-push, branch creation, or a `before` this clone never had: what the
            # push introduced is unknowable, so lint the pushed commit and nothing else.
            # Walking back to the merge base instead would re-lint the whole divergence —
            # 35 already-merged commits in the fork-sync case, one of which predates this
            # rule and fails it. CI must not red on history it cannot change.
            BASE="${HEAD_SHA}^"
          fi
          if [[ -n "${BASE}" ]]; then
            npx commitlint --from "${BASE}" --to "${HEAD_SHA}" --verbose
          else
            # Root commit: no parent to anchor a range to.
            npx commitlint --to "${HEAD_SHA}" --verbose
          fi
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.head_commit.id }}

  unit-os:
    # The unit suite on the other client platforms the extension runs on: Windows-only
    # code (ProxyCommand splitting, the PowerShell install path, path handling) otherwise
    # never executes in CI. Linux runs it in `check`, under the coverage ratchet.
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      # The Windows runner checks out CRLF by default; the repo and its tests are LF.
      - name: Keep LF line endings
        run: |
          git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # No git hooks on a CI runner; `prepare` (husky) is POSIX-shell shaped anyway.
      - name: Install dependencies
        run: |
          npm ci
        env:
          HUSKY: '0'

      - name: Test
        run: |
          npm test

  package:
    # Release packaging runs vsce on Node 22 (its locked toolchain needs >= 22.13, see
    # check-packaging-node.js), not the repo's Node 20, so packaging breakage used to
    # surface only at release. Package here on the release runtime, and hold the vsix to
    # the .vscodeignore whitelist. Packaging builds first (vscode:prepublish).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm ci

      - name: Check packaging Node compatibility
        run: node .github/scripts/check-packaging-node.js

      - name: Package
        run: |
          npm run package

      - name: Check vsix contents
        run: |
          node .github/scripts/check-vsix-contents.js *.vsix

  tmux-rig:
    # Real tmux over real ssh2, one docker sshd per release (test/rig/). Its own job so
    # `npm test` stays fast; a matrix so each release builds and fails on its own.
    name: tmux rig (${{ matrix.tmux }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tmux: ["2.6", "3.0a", "3.4", "3.5a", "3.8"]
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm ci

      - name: Real-tmux integration tests
        run: |
          npm run test:tmux -- "${TMUX_VERSION}"
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
