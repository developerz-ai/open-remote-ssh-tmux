$schema: https://raw.githubusercontent.com/zokugun/artifact/v0.12.0/schemas/v4/install.json
artifacts:
  "@daiyam/artifact-lang-js":
    version: 0.14.7
    requires:
      - "20"
    update:
      # Deleted on purpose: staleness is .dz/maintainer/maintainer.yml's alone, and this
      # actions/stale copy contradicted its windows. Never restore it.
      .github/workflows/mod-stale-issue-pr.yml:
        if_missing: skip
      # The toolchain is on Node 24 LTS; this artifact's "20" variant ships v20.20.2.
      .nvmrc:
        if_exists: skip
  "@daiyam/artifact-lang-ts":
    version: 0.10.6
    update:
      .xo-config.json:
        if_missing: skip
      tsconfig.base.json:
        if_missing: skip
      tsconfig.json:
        if_exists: skip
  "@daiyam/artifact-vsx-ts":
    version: 0.11.17
    update:
      .vscodeignore:
        if_exists: skip
      .github/**:
        if_exists: skip
      src/**:
        if_missing: skip
